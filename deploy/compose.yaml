# PetBox prod deployment: the app + an offsite-backup sidecar.
# Rendered/driven by the CI `deploy` job (see .github/workflows/ci.yml), which
# supplies every ${VAR} from GitHub Actions secrets via the deploy shell env.
# Bring up manually with:  docker compose -f deploy/compose.yaml up -d --build
name: petbox

services:
  petbox:
    image: ${PETBOX_IMAGE}
    container_name: petbox
    restart: unless-stopped
    # Must stay >= ShutdownBudget.MinimumStopGracePeriod (src/PetBox.Web/ShutdownBudget.cs),
    # asserted by ComposeStopGraceTests. Docker's default is 10 s, which SIGKILLed the app
    # mid-drain while its own ShutdownTimeout still believed it had 30. Not a wait: docker
    # stops as soon as the process exits and only kills at this deadline.
    stop_grace_period: 40s
    # Without a limit here the container inherits "unlimited" and can eat the whole host —
    # which is exactly what happened: every OOM before 2026-08-12 logged
    # `constraint=CONSTRAINT_NONE` (a HOST-level OOM, not a cgroup one), taking down sibling
    # services (Caddy-L4, accel-ppp, 3proxy, yobapub-proxy) and TCP/443 with it. Defaults sized
    # for the actual prod host: 1 vCPU / 1793 MiB RAM / 896 MiB swap, shared with those four
    # daemons plus petbox-backup. Post-fix baseline RSS for petbox is well under 150 MiB
    # (comparable siblings YobaLog/YobaConf run ~80-105 MiB); the pre-fix leak that caused the
    # incident above peaked around 560-725 MiB before being killed. 1024m leaves real headroom
    # above that worst observed spike (so a legitimate burst — a big KQL query, an embedding
    # batch, a log-ingestion spike — doesn't trip a false-positive self-OOM) while still capping
    # the blast radius at ~57% of host RAM, leaving the rest for the host + siblings. It also
    # matters for a second, unrelated reason: .NET's GC computes its heap hard limit as ~75% of
    # the cgroup memory limit (768 MiB here); with NO limit set it calibrates against the HOST's
    # memory instead and never sees a ceiling worth reacting to — this line is what gives the GC
    # a pressure signal at all, not just a blast-radius fence. `memswap_limit` caps combined
    # memory+swap so a degraded-but-not-crashed container can't quietly swap-thrash for HOURS on
    # a 1-vCPU host (the failure mode HEALTHCHECK below is also aimed at) — it's capped to 256
    # MiB of swap above mem_limit, leaving the bulk of the host's 896 MiB swap for everyone else.
    # Override per-deploy with `PETBOX_MEM_LIMIT=... PETBOX_MEMSWAP_LIMIT=... docker compose ...`.
    mem_limit: ${PETBOX_MEM_LIMIT:-1024m}
    memswap_limit: ${PETBOX_MEMSWAP_LIMIT:-1280m}
    ports:
      - "127.0.0.1:8083:8080"   # loopback only — central Caddy terminates TLS
    volumes:
      - /opt/petbox/data:/app/data
    environment:
      Admin__Username: ${ADMIN_USER}
      Admin__PasswordHash: ${ADMIN_PASS_HASH}
      PETBOX_MASTER_KEY: ${MASTER_KEY}
      Features__Config: "true"
      Features__Logging: "true"
      Features__Data: "true"
      Features__Dashboard: "true"
      Seq__SelfLog__Enabled: "true"
      OpenTelemetry__Enabled: ${OTEL_ENABLED}
      OpenTelemetry__OtlpEndpoint: ${OTEL_ENDPOINT}

  # Offsite backup. Reads the data volume read-only; pushes restic repos to two
  # S3 backends (compact->R2, full->FirstVDS) — same data-only contents in both,
  # PetBox's own logs/ are never backed up (see deploy/backup/backup.sh). Independent
  # of the petbox process health — a petbox crash-loop does not stop backups.
  petbox-backup:
    build:
      context: ./backup
    image: petbox-backup:local
    container_name: petbox-backup
    restart: unless-stopped
    depends_on:
      - petbox
    volumes:
      - /opt/petbox/data:/data:ro
      - petbox-backup-state:/state
    environment:
      DATA_DIR: /data
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_CRON: ${BACKUP_CRON:-17 */6 * * *}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-7}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-4}
      # compact -> Cloudflare R2
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      # full -> FirstVDS S3
      FVDS_ACCESS_KEY_ID: ${FVDS_ACCESS_KEY_ID}
      FVDS_SECRET_ACCESS_KEY: ${FVDS_SECRET_ACCESS_KEY}
      FVDS_S3_ENDPOINT: ${FVDS_S3_ENDPOINT}
      FVDS_BUCKET: ${FVDS_BUCKET}
      # optional: failure alert + success heartbeat (all no-ops if unset)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      ALERT_REPEAT_HOURS: ${ALERT_REPEAT_HOURS:-24}

volumes:
  petbox-backup-state:
