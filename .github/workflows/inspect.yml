name: Inspect

# Reusable workflow, called from ci.yml's `inspect` job on the `deploy` tag push only — NOT
# triggered on its own push event any more. Owner decision 2026-08-30 (work/
# inspect-gate-once-on-merged-tree): running this on every branch push checked a tree state
# that never lands on main verbatim, while the state that actually matters — the merged tree
# about to ship — went unchecked. `deploy` in ci.yml now `needs: [..., inspect]`, so this job
# runs exactly once per deploy, on the exact commit the `deploy` tag points to, before the
# deploy job's steps execute. Kept as a separate file (rather than inlined as a job in ci.yml)
# purely for the caching/setup detail below (jb is a ~978MB global tool with its own pinned
# version and settings-keyed inspectcode cache) — no longer to dodge triggering ci.yml's other
# jobs, since this no longer has its own push trigger at all. `workflow_dispatch` stays for an
# ad-hoc manual run (e.g. to debug a finding on a branch by hand) — see AGENTS.md and
# scripts/inspect-gate.cs for the gate's own rationale and exit-code contract.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # No fetch-depth: 0 — inspectcode analyzes the checked-out tree, not history; the default
        # (depth-1) checkout is sufficient and cheaper. If that turns out wrong (e.g. some MSBuild
        # target here needs git history) the fix is a one-line addition, not a reason to default to
        # full history speculatively.

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Same key as ci.yml's `test`/`sdk`/`publish` jobs — the gate's `jb inspectcode` shells
          # out to an MSBuild restore over the same solution, so it can reuse whatever cache those
          # jobs already warmed (and vice versa) instead of keying its own separate copy.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # jb is a globally installed dotnet tool (~978MB), not something the repo's own
      # dotnet-tools.json manifest pulls in — see scripts/inspect-gate.cs's top-of-file comment on
      # why `dotnet tool restore` is not the fix. Installed to an explicit --tool-path (not the
      # default ~/.dotnet/tools) purely because an explicit directory is simpler to point
      # actions/cache at than a shared tools directory that may also hold other tools.
      #
      # Version is PINNED, not `dotnet tool install -g` latest: scripts/inspect-gate.cs hardcodes
      # ExpectedJbVersion = "2026.2" and refuses to run (exit 2) against a mismatched jb — and a
      # newer jb release is known to trip that check. The cache key includes the version so a
      # future bump here also rotates the cache instead of silently reusing an old install.
      - name: Resolve jb tool cache
        id: jb-tool-cache
        run: echo "path=$HOME/.jb-tools" >> "$GITHUB_OUTPUT"

      - name: Cache jb (JetBrains.ReSharper.GlobalTools)
        id: cache-jb
        uses: actions/cache@v4
        with:
          path: ${{ steps.jb-tool-cache.outputs.path }}
          key: jb-tool-2026.2.0-${{ runner.os }}

      - name: Install jb 2026.2.0
        if: steps.cache-jb.outputs.cache-hit != 'true'
        run: dotnet tool install JetBrains.ReSharper.GlobalTools --version 2026.2.0 --tool-path "${{ steps.jb-tool-cache.outputs.path }}"

      - name: Add jb tool dir to PATH
        run: echo "${{ steps.jb-tool-cache.outputs.path }}" >> "$GITHUB_PATH"

      # inspectcode's own solution cache (--caches-home, see scripts/inspect-gate.cs) is keyed by
      # settings CONTENT there — a locally-computed hash of .editorconfig, PetBox.slnx.DotSettings,
      # and ExternalAnnotations/**. Mirrored here via hashFiles() so a settings edit rotates the CI
      # cache exactly like it rotates the local one: reuse a stale cache and jb silently reports
      # yesterday's findings against today's settings (the bug --caches-home exists to prevent).
      - name: Resolve inspectcode caches-home
        id: inspect-cache-home
        run: echo "path=$HOME/.inspectcode-caches-home" >> "$GITHUB_OUTPUT"

      - name: Cache inspectcode caches-home
        uses: actions/cache@v4
        with:
          path: ${{ steps.inspect-cache-home.outputs.path }}
          key: inspectcode-caches-home-${{ runner.os }}-${{ hashFiles('.editorconfig', 'PetBox.slnx.DotSettings', 'ExternalAnnotations/**') }}

      # --no-lock is REQUIRED here, not optional: the machine-global mutex
      # (Global\petbox-inspect-gate) this script otherwise takes exists to serialize concurrent
      # gate runs sharing ONE machine's MSBuild worker-node pool — meaningless on a fresh,
      # single-use GitHub-hosted runner. Worse, the mutex name has a literal backslash, and on a
      # non-Windows runner `new Mutex(false, @"Global\petbox-inspect-gate")` can throw an exception
      # scripts/inspect-gate.cs does not catch (only UnauthorizedAccessException,
      # WaitHandleCannotBeOpenedException, and IOException are handled there) — --no-lock skips
      # the mutex path entirely rather than relying on that catch clause covering it.
      # Exit 1 (findings survived) fails this step, and this job now blocks the `deploy` job in
      # ci.yml via `needs:` — a real finding correctly stops the deploy. Exit 2 (`COULD NOT
      # VERIFY`, the tool itself never got a clean run after 3 attempts) is NOT a code finding —
      # under the old push-triggered scheme it never blocked anything because the verdict came
      # back asynchronously after the push already landed. Now that this job sits in the deploy
      # tag's critical path, exit 2 would otherwise block a prod deploy for a reason that has
      # nothing to do with the code being deployed (a JetBrains-tool hiccup on the runner).
      # Decision (work/inspect-gate-once-on-merged-tree): downgrade exit 2 to a `::warning::`
      # and let the job succeed — deploy proceeds on an inconclusive inspect run rather than
      # being blocked by one. Exit 1 and exit 0 are passed through unchanged.
      - name: Run inspect-gate
        run: |
          set +e
          dotnet run scripts/inspect-gate.cs -- --no-lock --caches-home "${{ steps.inspect-cache-home.outputs.path }}"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::inspect-gate exited 2 (COULD NOT VERIFY — tool infra issue, not a code finding). Not blocking deploy; see AGENTS.md and work/inspect-gate-once-on-merged-tree."
            exit 0
          fi
          exit "$code"

      - name: Measure caches-home size
        if: always()
        run: du -sh "${{ steps.inspect-cache-home.outputs.path }}" || true
